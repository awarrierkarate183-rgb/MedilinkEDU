<!--
  SITE HEADER. Loaded on every page by layout.js.
  White bar. Six primary links. No dropdowns. Detail lives in page widgets.

  Main links: Home, About, Competitions, Chapters, Get Involved, Contact.
  Submit News stays in the bar as a gold action, not a nav item.

  To add a page to the bar, copy an existing <a> and change href, data-nav, and label.
  data-nav must match the page's <body data-page="..."> value.
-->
<div class="header-wrapper">
  <header class="site-header" id="top">
    <div class="container nav-wrap">
      <a class="brand" href="index.html">MediLink</a>
      <nav class="main-nav" id="site-nav" aria-label="Primary">
        <a href="index.html" data-nav="home">Home</a>
        <a href="about.html" data-nav="about">About</a>
        <a href="competition.html" data-nav="competition">Competitions</a>
        <a href="chapters.html" data-nav="chapters">Chapters</a>
        <a href="involved.html" data-nav="involved">Get Involved</a>
        <a href="contact.html" data-nav="contact">Contact</a>
      </nav>
      <div class="header-actions">
        <!-- SUBMIT NEWS: email flow today. Later, point this at a Google Form in data/forms.config.js (key: submitNews). -->
        <a class="util-bar__news" href="involved.html#submit-news">Submit News</a>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">Menu</button>
      </div>
    </div>
  </header>
</div>
